    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    /**

     * ============================================================================

     * Standard Bezel Width = 148.0 mm, Standard Bezel Height = 42.0 mm.

        chassisHeight: 87.0,     // 43mm upper orange front + 42mm DVD bay + 2mm lips/seams
        chassisDepth: 182.0,     // Front-to-rear depth matching top & side views
        chassisCornerRadius: 1.2,

        // Solid natural oak wood side cheeks

        woodHeight: 87.0,
        woodDepth: 182.0,
        woodBevel: 0.9,

        // Bottom rubber feet
        footRadius: 9.5,
        footHeight: 2.6,
        footInsetX: 54.0,
        footInsetZ: 64.0
      },
      colors: {
        studioBg: 0xe6e6e6,
        orangePaint: '#e34a00',
        orangePaintHex: 0xe34a00,
        dvdCream: 0xe8e4da,
        dvdDarkSlot: 0x22211f,
        matteBlack: 0x161719,
        switchBlack: 0x151618,
        silverCap: 0xdcdfe4,
        darkCap: 0x3a3d42,
        chrome: 0xf4f6f8,

      },
      // Exact 1:1 coordinate table (in mm on the 150x182mm top panel) derived from the Top View reference

        btnFf:   { x: -8.02,  z: 59.38, bezelW: 14.2, bezelD: 14.2, capW: 11.0, capD: 11.0, iconZ: 70.93 },
        btnEject:{ x: 53.28,  z: 58.38, bezelW: 19.2, bezelD: 16.2, capW: 15.6, capD: 12.6, iconZ: 70.93 },
        pitch:   { x: 55.95,  topZ: -20.53, botZ: 38.73, centerZ: 9.10, halfTravel: 29.63, labelZ: 42.93 }
      },
      initialState: {
        powerOn: true,
        isPlaying: true,
        track: 6,
        elapsedSeconds: 84.86,   // 01:24:86 shown in reference photo
        pitchNormalized: -0.21,  // Exact fader position shown in top & side reference photos
        trayOpen: false
      }
    };

    /**
     * ============================================================================
     * 2. BASE MODULAR ARCHITECTURE (Scalable 3D & Web Component Registry)
     * ============================================================================
     */
    export class Component3D {
      constructor(name, context) {
        this.name = name;
        this.context = context;
        this.group = new THREE.Group();
        this.group.name = name;
        this.interactables = [];
        this.subComponents = new Map();
      }

      init() {}

      addSubComponent(component) {
        component.init();
        this.subComponents.set(component.name, component);
        this.group.add(component.group);
        this.interactables.push(...component.interactables);
        return component;
      }

      registerInteractable(mesh, handlerConfig) {
        mesh.userData.interactable = true;
        mesh.userData.handler = handlerConfig;
        this.interactables.push(mesh);
      }

      update(delta, elapsed) {
        for (const sub of this.subComponents.values()) {
          sub.update(delta, elapsed);
        }
      }
    }

    /**
     * ============================================================================
     * 3. STUDIO HDRI & PROCEDURAL TEXTURE GENERATOR
     * ============================================================================
     * Generates a real 32-bit Radiance (.hdr RGBE) studio environment parsed via
     * RGBELoader, plus tangent-space normal maps, photographic oak wood textures,
     * 1:1 top-panel stencil artwork, and VFD amber phosphor textures.
     */
    export class ProceduralTextures {
      static hash2D(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return n - Math.floor(n);
      }

      static smoothNoise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uy = fy * fy * (3.0 - 2.0 * fy);

        const a = this.hash2D(ix, iy);
        const b = this.hash2D(ix + 1, iy);
        const c = this.hash2D(ix, iy + 1);
        const d = this.hash2D(ix + 1, iy + 1);

        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }

      static fbm(x, y, octaves = 4) {
        let value = 0.0;
        let amp = 0.5;
        let freq = 1.0;
        for (let i = 0; i < octaves; i++) {
          value += amp * this.smoothNoise(x * freq, y * freq);
          freq *= 2.02;
          amp *= 0.5;
        }
        return value;
      }

      /**
       * Converts a grayscale heightfield array (0..1) into a WebGPU-native
       * tangent-space normal map CanvasTexture.
       */
      static heightArrayToNormalTexture(heights, width, height, strength = 3.0) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data;

        for (let y = 0; y < height; y++) {
          const yUp = (y - 1 + height) % height;
          const yDown = (y + 1) % height;
          for (let x = 0; x < width; x++) {
            const xLeft = (x - 1 + width) % width;
            const xRight = (x + 1) % width;

            const dX = (heights[y * width + xRight] - heights[y * width + xLeft]) * strength;
            const dY = (heights[yDown * width + x] - heights[yUp * width + x]) * strength;
            const dZ = 1.0;
            const invLen = 1.0 / Math.sqrt(dX * dX + dY * dY + dZ * dZ);

            const idx = (y * width + x) * 4;
            data[idx] = Math.round(((dX * invLen) * 0.5 + 0.5) * 255);
            data[idx + 1] = Math.round(((dY * invLen) * 0.5 + 0.5) * 255);
            data[idx + 2] = Math.round(((dZ * invLen) * 0.5 + 0.5) * 255);
            data[idx + 3] = 255;
          }
        }

        ctx.putImageData(imgData, 0, 0);
        const normalTex = new THREE.CanvasTexture(canvas);
        normalTex.colorSpace = THREE.NoColorSpace;
        normalTex.anisotropy = 8;
        normalTex.needsUpdate = true;
        return normalTex;
      }

      /**
       * Generates an authentic Radiance (.hdr RGBE) binary file in memory with true
       * High Dynamic Range studio softboxes (up to 45.0 linear radiance) and deep
       * negative fill (~0.01) for dramatic photographic contrast, parsed via RGBELoader.
       */
      static createStudioRadianceHDRI(width = 1024, height = 512) {
        const headerStr = `#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y ${height} +X ${width}\n`;
        const encoder = new TextEncoder();
        const headerBytes = encoder.encode(headerStr);
        const pixelBytes = new Uint8Array(width * height * 4);

        const floatToRGBE = (r, g, b, outBuf, offset) => {
          const maxComp = Math.max(r, g, b);
          if (maxComp <= 1e-32) {
            outBuf[offset] = 0;
            outBuf[offset + 1] = 0;
            outBuf[offset + 2] = 0;
            outBuf[offset + 3] = 0;
            return;
          }
          const exp = Math.ceil(Math.log2(maxComp));
          const scale = Math.pow(2.0, -exp) * 256.0;
          let R = Math.min(255, Math.max(0, Math.floor(r * scale)));
          let G = Math.min(255, Math.max(0, Math.floor(g * scale)));
          let B = Math.min(255, Math.max(0, Math.floor(b * scale)));
          // Ensure first pixel doesn't accidentally trigger RLE magic header [2, 2]
          if (offset === 0 && R === 2 && G === 2) {
            R = 3;
          }
          outBuf[offset] = R;
          outBuf[offset + 1] = G;
          outBuf[offset + 2] = B;
          outBuf[offset + 3] = Math.min(255, Math.max(0, exp + 128));
        };

        // Crisp rectangular studio softbox with internal baffle diffusion & sharp barn-door cutoff
        const softboxContribution = (u, v, cu, cv, wu, wv, intensity, rTint, gTint, bTint) => {
          let du = Math.abs(u - cu);
          if (du > 0.5) du = 1.0 - du;
          const dv = Math.abs(v - cv);
          const nx = du / wu;
          const ny = dv / wv;
          // Sharp super-ellipse studio softbox boundary (p = 6.0)
          const dist = Math.pow(Math.pow(nx, 6.0) + Math.pow(ny, 6.0), 1.0 / 6.0);
          if (dist >= 1.35) return [0, 0, 0];
          // Hot center baffle with crisp edge falloff
          const core = dist < 0.85 ? 1.0 : Math.exp(-Math.pow((dist - 0.85) * 4.2, 2.4));
          const edgeHotspot = 1.0 + 0.15 * Math.sin(Math.min(1.0, dist) * Math.PI);
          const val = intensity * core * edgeHotspot;
          return [val * rTint, val * gTint, val * bTint];
        };

        for (let y = 0; y < height; y++) {
          const v = y / height; // 0 = North Pole (+Y zenith), 0.5 = Equator, 1.0 = South Pole (-Y floor)
          for (let x = 0; x < width; x++) {
            const u = x / width;

            // Deep studio negative fill (black velvet flags around the subject for strong 3D contrast)
            let r = 0.012;
            let g = 0.012;
            let b = 0.014;

            if (v > 0.54) {
              // Controlled studio table bounce with dark negative-fill skirt near horizon
              const floorT = Math.min(1.0, (v - 0.54) / 0.46);
              const bounce = 0.02 + 0.18 * Math.pow(Math.sin(floorT * Math.PI * 0.85), 2.2);
              r = bounce * 1.02;
              g = bounce * 1.00;
              b = bounce * 0.98;
            } else {
              // Dark studio ceiling with subtle horizon falloff
              const skyT = Math.pow(v / 0.54, 2.5);
              r = 0.008 + 0.024 * skyT;
              g = 0.008 + 0.024 * skyT;
              b = 0.010 + 0.028 * skyT;
            }

            // 1. Primary Key Light Softbox (Front-Right Overhead: 42.0 HDR radiance for crisp orange-peel speculars)
            const sbKey = softboxContribution(u, v, 0.345, 0.215, 0.072, 0.068, 42.0, 1.0, 0.98, 0.94);
            // 2. High-Contrast Top Strip Bank (Narrow overhead strip: 24.0 HDR radiance)
            const sbTopStrip = softboxContribution(u, v, 0.27, 0.095, 0.135, 0.028, 24.0, 1.0, 0.99, 0.97);
            // 3. Rear-Right Rim / Backlight Softbox (32.0 HDR radiance for dramatic edge separation & rear reflection)
            const sbRim = softboxContribution(u, v, 0.825, 0.265, 0.075, 0.070, 32.0, 1.0, 0.97, 0.93);
            // 4. Left Fill Strip Diffuser (18.0 HDR radiance, narrow strip to define left wood cheek & bezel bevels)
            const sbLeftStrip = softboxContribution(u, v, 0.115, 0.345, 0.038, 0.095, 18.0, 0.95, 0.98, 1.0);
            // 5. Right Lateral Accent Softbox (19.5 HDR radiance for rich oak wood grain depth)
            const sbRightSide = softboxContribution(u, v, 0.535, 0.325, 0.055, 0.085, 19.5, 1.0, 0.96, 0.90);

            r += sbKey[0] + sbTopStrip[0] + sbRim[0] + sbLeftStrip[0] + sbRightSide[0];
            g += sbKey[1] + sbTopStrip[1] + sbRim[1] + sbLeftStrip[1] + sbRightSide[1];
            b += sbKey[2] + sbTopStrip[2] + sbRim[2] + sbLeftStrip[2] + sbRightSide[2];

            const idx = (y * width + x) * 4;
            floatToRGBE(r, g, b, pixelBytes, idx);
          }
        }

        const fullBuffer = new Uint8Array(headerBytes.length + pixelBytes.length);
        fullBuffer.set(headerBytes, 0);
        fullBuffer.set(pixelBytes, headerBytes.length);

        try {
          const loader = new RGBELoader();
          const parsed = loader.parse(fullBuffer.buffer);
          const hdrTex = new THREE.DataTexture(
            parsed.data,
            parsed.width,
            parsed.height,
            THREE.RGBAFormat,
            parsed.type
          );
          hdrTex.mapping = THREE.EquirectangularReflectionMapping;
          hdrTex.minFilter = THREE.LinearFilter;
          hdrTex.magFilter = THREE.LinearFilter;
          hdrTex.generateMipmaps = false;
          hdrTex.needsUpdate = true;
          return hdrTex;
        } catch (err) {
          return this.createFallbackStudioEnvMap();
        }
      }

      static createFallbackStudioEnvMap() {
        const w = 512;
        const h = 256;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0.0, '#222226');
        bg.addColorStop(0.5, '#343438');
        bg.addColorStop(1.0, '#bcbcbc');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        const drawBox = (cx, cy, rw, rh, alpha) => {
          const g = ctx.createRadialGradient(cx, cy, rw * 0.1, cx, cy, rw);
          g.addColorStop(0.0, `rgba(255, 253, 248, ${alpha})`);
          g.addColorStop(1.0, 'rgba(255, 253, 248, 0.0)');
          ctx.fillStyle = g;
          ctx.fillRect(cx - rw, cy - rh, rw * 2, rh * 2);
        };
        drawBox(w * 0.34, h * 0.22, 95, 50, 1.0);
        drawBox(w * 0.82, h * 0.26, 85, 45, 0.95);
        drawBox(w * 0.14, h * 0.34, 70, 45, 0.75);

        const tex = new THREE.CanvasTexture(canvas);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
      }

      /**
       * Creates the signature glossy "orange peel" (piel de naranja) powder-coat normal map
       * with a sleek metallic-enamel micro-finish
       */
      static createOrangePeelNormalMap(size = 1024) {
        const heights = new Float32Array(size * size);
        const scale = 34.0;

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const nx = (x / size) * scale;
            const ny = (y / size) * scale;
            const n1 = this.fbm(nx, ny, 3);
            const n2 = this.smoothNoise(nx * 2.2, ny * 2.2) * 0.22;
            heights[y * size + x] = n1 + n2;
          }
        }

        const normalTex = this.heightArrayToNormalTexture(heights, size, size, 1.45);
        normalTex.wrapS = THREE.RepeatWrapping;
        normalTex.wrapT = THREE.RepeatWrapping;
        normalTex.repeat.set(3.2, 3.2);
        return normalTex;
      }

      /**
       * Creates ultra-detailed photographic natural oak/ash wood textures (2048x1024)
       * matching the Side View reference photo (cathedral arch figure, open latewood pores,
       * fine vessel dashes, medullary rays, tangent-space normal map, and roughness map).
       */
      static createWoodTextures(horizontal = true) {
        const width = horizontal ? 2048 : 512;
        const height = horizontal ? 1024 : 1024;

        const colorCanvas = document.createElement('canvas');
        colorCanvas.width = width;
        colorCanvas.height = height;
        const ctx = colorCanvas.getContext('2d');

        const roughCanvas = document.createElement('canvas');
        roughCanvas.width = width;
        roughCanvas.height = height;
        const rCtx = roughCanvas.getContext('2d');

        const imgData = ctx.createImageData(width, height);
        const rImgData = rCtx.createImageData(width, height);
        const data = imgData.data;
        const rData = rImgData.data;
        const heights = new Float32Array(width * height);

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const u = horizontal ? x / width : y / height;
            const v = horizontal ? y / height : x / width;

            // 1. Macro cathedral arch figure matching the 4th reference photo (Side View)
            const archCenter = 0.43 + 0.07 * Math.sin(u * Math.PI * 1.65 - 0.4);
            const dy = v - archCenter;
            const parabola = Math.sqrt(dy * dy + 0.008) * (1.45 - 0.52 * u);

            // Multi-scale organic domain warping
            const warpLow = this.fbm(u * 2.6 + 1.3, v * 5.2 + 2.1, 4) * 0.28;
            const warpMid = this.fbm(u * 7.5 + 4.7, v * 16.0 + 0.8, 3) * 0.08;

            // Growth ring coordinate
            const ringCoord = parabola * 29.0 + warpLow * 7.5 + warpMid * 3.0;
            const ringWave = 0.5 + 0.5 * Math.sin(ringCoord * Math.PI * 2.0);
            const latewoodBand = Math.pow(ringWave, 2.85);

            // 2. High-frequency open oak pores / vessel channels running parallel to grain
            const poreNoise1 = this.smoothNoise(u * 135.0 + warpLow * 4.0, v * 480.0 + ringCoord * 0.6);
            const poreNoise2 = this.smoothNoise(u * 260.0 + 13.0, v * 820.0);
            const poreMask = 0.35 + 0.65 * latewoodBand;
            const openPore = poreNoise1 < (0.22 * poreMask)
              ? Math.min(1.0, ((0.22 * poreMask) - poreNoise1) * 6.5)
              : 0.0;
            const microFiber = (poreNoise2 - 0.5) * 0.14;

            // 3. Subtle cross-grain medullary rays (silky flecks typical of oak)
            const rayNoise = this.smoothNoise(u * 42.0, v * 14.0 + warpLow * 2.0);
            const medullaryRay = rayNoise > 0.78 ? (rayNoise - 0.78) * 1.4 : 0.0;

            // 4. Photographic tonal features from the reference side view:
            const dxStreak = (u - 0.33) / 0.065;
            const dyStreak = (v - 0.655) / 0.007;
            const mineralStreak = Math.exp(-(dxStreak * dxStreak + dyStreak * dyStreak)) * 0.65;
            const rightWarmth = Math.exp(-(((u - 0.84) / 0.22) ** 2 + ((v - 0.56) / 0.26) ** 2)) * 0.22;

            const grainDensity = Math.min(
              1.0,
              Math.max(
                0.0,
                latewoodBand * 0.58 +
                openPore * 0.48 +
                mineralStreak +
                rightWarmth +
                microFiber -
                medullaryRay * 0.22
              )
            );

            // Color ramp sampled directly from the Side View reference photo
            let r, g, b;
            if (grainDensity < 0.5) {
              const t = grainDensity * 2.0;
              r = 236 - t * 29;
              g = 176 - t * 48;
              b = 113 - t * 54;
            } else {
              const t = (grainDensity - 0.5) * 2.0;
              r = 207 - t * 72;
              g = 128 - t * 66;
              b = 59 - t * 42;
            }

            const idx = (y * width + x) * 4;
            data[idx] = Math.max(0, Math.min(255, Math.round(r)));
            data[idx + 1] = Math.max(0, Math.min(255, Math.round(g)));
            data[idx + 2] = Math.max(0, Math.min(255, Math.round(b)));
            data[idx + 3] = 255;

            // Heightfield for tangent-space normal map generation
            heights[y * width + x] = Math.max(
              0.0,
              Math.min(1.0, 0.88 - latewoodBand * 0.28 - openPore * 0.54 - mineralStreak * 0.32 + microFiber * 0.14)
            );

            // Roughness map (open pores are rougher, satin-finished earlywood is smoother)
            const roughVal = Math.max(0, Math.min(255, Math.round(96 + latewoodBand * 48 + openPore * 86)));
            rData[idx] = roughVal;
            rData[idx + 1] = roughVal;
            rData[idx + 2] = roughVal;
            rData[idx + 3] = 255;
          }
        }

        ctx.putImageData(imgData, 0, 0);
        rCtx.putImageData(rImgData, 0, 0);

        const colorTex = new THREE.CanvasTexture(colorCanvas);
        colorTex.colorSpace = THREE.SRGBColorSpace;
        colorTex.anisotropy = 8;
        colorTex.needsUpdate = true;

        const normalTex = this.heightArrayToNormalTexture(heights, width, height, 2.6);

        const roughTex = new THREE.CanvasTexture(roughCanvas);
        roughTex.colorSpace = THREE.NoColorSpace;
        roughTex.anisotropy = 8;
        roughTex.needsUpdate = true;

        return { colorTex, normalTex, roughTex };
      }

      /**
       * Creates the 2048x2048 Top Panel Texture by mapping the exact pixel coordinates
       * from the Top View reference photo (`WhatsApp Image 2026-09-30 at 1.30.37 PM (1).jpg`)
       * directly onto the orange top face texture, and using the exact 3D millimeter
       * coordinates from `AppConfig.topLayout` for all silkscreen icons so they align 1:1
       * with the 3D buttons and pitch fader.
       */
      static createTopPanelTexture() {
        const size = 2048;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Fill base deep saturated orange enamel (#e34a00)
        ctx.fillStyle = AppConfig.colors.orangePaint;
        ctx.fillRect(0, 0, size, size);

        // Subtle bent sheet-metal edge highlight & shadow along the left/right flange seams (as seen in Top View)
        const leftSeamGrad = ctx.createLinearGradient(0, 0, size * 0.045, 0);
        leftSeamGrad.addColorStop(0.0, 'rgba(90, 22, 0, 0.32)');
        leftSeamGrad.addColorStop(0.38, 'rgba(255, 195, 140, 0.42)');

      /**
       * Creates the Rear Panel orange texture with the black rounded-square 'L' and 'R' badges
       */
      static createRearPanelTexture() {
        const width = 1024;
        const height = 512;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = AppConfig.colors.orangePaint;
        ctx.fillRect(0, 0, width, height);

        const mmToX = (mmX) => ((mmX + 75.0) / 150.0) * width;
        const mmToY = (mmY) => ((43.5 - mmY) / 87.0) * height;
        const sX = width / 150.0;
        const sY = height / 87.0;

        const drawBadge = (mmX, mmY, letter) => {
          const cx = mmToX(mmX);
          const cy = mmToY(mmY);
          const bw = 4.6 * sX;
          const bh = 4.6 * sY;
          const r = 0.9 * sX;

          ctx.fillStyle = '#181818';
          ctx.beginPath();
          ctx.roundRect(cx - bw / 2, cy - bh / 2, bw, bh, r);
          ctx.fill();

          ctx.fillStyle = AppConfig.colors.orangePaint;
          ctx.font = `700 ${Math.round(3.1 * sY)}px "Inter", Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(letter, cx, cy + 0.15 * sY);
        };

        drawBadge(-30.5, 22.8, 'L');
        drawBadge(-50.5, 22.8, 'R');

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 8;
        texture.needsUpdate = true;
        return texture;
      }

      /**
       * Creates a tangent-space normal map for the embossed "COMPACT disc Recordable ReWritable" badge
       */
      static createCompactDiscBadgeNormalMap() {
        const w = 256;
        const h = 256;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#c8c8c8';
        ctx.lineWidth = 8;
        ctx.strokeRect(14, 14, w - 28, h - 28);

        ctx.fillStyle = '#eaeaea';
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px Arial, sans-serif';
        ctx.fillText('COMPACT', w * 0.62, 52);

        ctx.font = '900 72px "Arial Black", Impact, sans-serif';
        ctx.fillText('disc', w * 0.5, 118);

        ctx.strokeStyle = '#d8d8d8';
        ctx.lineWidth = 4;
        ctx.strokeRect(28, 136, w - 56, 40);
        ctx.strokeRect(28, 184, w - 56, 40);

        ctx.font = 'bold 24px Arial, sans-serif';
        ctx.fillText('Recordable', w * 0.5, 164);
        ctx.fillText('ReWritable', w * 0.5, 212);

        const imgData = ctx.getImageData(0, 0, w, h).data;
        const heights = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++) {
          heights[i] = imgData[i * 4] / 255.0;
        }
        return this.heightArrayToNormalTexture(heights, w, h, 3.8);
      }

      /**
       * Creates the 5x7 dot-matrix character bitmap lookup for the 16x2 VFD display
       */
      static getLcdGlyph(char) {
        const glyphs = {
          'T': [0b11111, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100],
          'r': [0b00000, 0b00000, 0b10110, 0b11001, 0b10000, 0b10000, 0b10000],
          'a': [0b00000, 0b00000, 0b01110, 0b00001, 0b01111, 0b10001, 0b01111],
          'c': [0b00000, 0b00000, 0b01110, 0b10000, 0b10000, 0b10001, 0b01110],
          'k': [0b10000, 0b10000, 0b10010, 0b10100, 0b11000, 0b10100, 0b10010],
          'P': [0b11110, 0b10001, 0b10001, 0b11110, 0b10000, 0b10000, 0b10000],
          'u': [0b00000, 0b00000, 0b10001, 0b10001, 0b10001, 0b10011, 0b01101],
          's': [0b00000, 0b00000, 0b01110, 0b10000, 0b01110, 0b00001, 0b11110],
          'e': [0b00000, 0b00000, 0b01110, 0b10001, 0b11111, 0b10000, 0b01110],
          'O': [0b01110, 0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b01110],
          'p': [0b00000, 0b00000, 0b11110, 0b10001, 0b11110, 0b10000, 0b10000],
          'n': [0b00000, 0b00000, 0b10110, 0b11001, 0b10001, 0b10001, 0b10001],
          '0': [0b01110, 0b10001, 0b10011, 0b10101, 0b11001, 0b10001, 0b01110],
          '1': [0b00100, 0b01100, 0b00100, 0b00100, 0b00100, 0b00100, 0b01110],
          '2': [0b01110, 0b10001, 0b00001, 0b00010, 0b00100, 0b01000, 0b11111],
          '3': [0b11111, 0b00010, 0b00100, 0b00010, 0b00001, 0b10001, 0b01110],
          '4': [0b00010, 0b00110, 0b01010, 0b10010, 0b11111, 0b00010, 0b00010],
          '5': [0b11111, 0b10000, 0b11110, 0b00001, 0b00001, 0b10001, 0b01110],
          '6': [0b00110, 0b01000, 0b10000, 0b11110, 0b10001, 0b10001, 0b01110],
          '7': [0b11111, 0b00001, 0b00010, 0b00100, 0b01000, 0b01000, 0b01000],
          '8': [0b01110, 0b10001, 0b10001, 0b01110, 0b10001, 0b10001, 0b01110],
          '9': [0b01110, 0b10001, 0b10001, 0b01111, 0b00001, 0b00010, 0b01100],

          ' ': [0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b00000]
        };
        return glyphs[char] || glyphs[' '];
      }
    }

    export class DvdDriveComponent extends Component3D {
      init() {
        const { chassisHeight, chassisDepth, dvdBezelWidth, dvdBezelHeight, dvdBezelDepth } = AppConfig.dimensions;
        const mats = this.context.materials;

        const bezelCenterY = -chassisHeight / 2 + 1.1 + dvdBezelHeight / 2;
        const bezelFrontZ = chassisDepth / 2 - 0.6;

        this.group.position.set(0, bezelCenterY, bezelFrontZ);

        const bezelGeo = new RoundedBoxGeometry(dvdBezelWidth, dvdBezelHeight, dvdBezelDepth, 3, 0.75);
        const bezelMesh = new THREE.Mesh(bezelGeo, mats.get('dvdBezelPlastic'));
        bezelMesh.position.set(0, 0, -dvdBezelDepth / 2);
        bezelMesh.castShadow = true;
        bezelMesh.receiveShadow = true;
        this.group.add(bezelMesh);

        // 2. Dark Recessed Tray Cavity Opening

        const slotHeight = 18.4;

        this.trayGroup = new THREE.Group();
        this.trayGroup.position.set(0, slotY, 0);
        this.group.add(this.trayGroup);

        const trayDoor = new THREE.Mesh(trayDoorGeo, mats.get('dvdBezelPlastic'));
        trayDoor.position.set(0, 0, 0.35);
        trayDoor.castShadow = true;
        trayDoor.receiveShadow = true;
        this.trayGroup.add(trayDoor);

        // Embossed Central "COMPACT disc Recordable ReWritable" Badge
        const badgeGeo = new RoundedBoxGeometry(14.5, 13.4, 0.5, 2, 0.25);
        const badgeMesh = new THREE.Mesh(badgeGeo, mats.get('dvdBadgePlastic'));
        badgeMesh.position.set(0, 0, 1.52);
        this.trayGroup.add(badgeMesh);

        // Internal Sliding Platter & Optical Disc (visible when tray ejects)
        const platterGeo = new RoundedBoxGeometry(128.0, 2.2, 136.0, 2, 0.5);
        const platterMesh = new THREE.Mesh(platterGeo, mats.get('matteBlackPlastic'));
        platterMesh.position.set(0, -5.5, -68.5);
        this.trayGroup.add(platterMesh);

        const discGeo = new THREE.CylinderGeometry(58.0, 58.0, 0.8, 48);
        const discMat = new THREE.MeshPhysicalMaterial({
          color: 0xe8f0ff,
          metalness: 0.85,
          roughness: 0.12,
          iridescence: 1.0,
          iridescenceIOR: 1.35,
          clearcoat: 1.0
        });
        this.discMesh = new THREE.Mesh(discGeo, discMat);
        this.discMesh.position.set(0, -4.1, -68.5);
        this.trayGroup.add(this.discMesh);

        // 4. Lower-Left Emerald-Green Activity LED + Optical Bloom Halo
        const ledX = -56.2;
        const ledY = -12.2;

        const ledRecessGeo = new THREE.BoxGeometry(5.2, 2.4, 1.2);
        const ledRecess = new THREE.Mesh(ledRecessGeo, mats.get('deepRecessBlack'));
        ledRecess.position.set(ledX, ledY, -0.05);
        this.group.add(ledRecess);

        const ledLensGeo = new RoundedBoxGeometry(4.4, 1.7, 0.9, 2, 0.25);
        this.ledMesh = new THREE.Mesh(ledLensGeo, mats.get('dvdLed'));
        this.ledMesh.position.set(ledX, ledY, 0.12);
        this.group.add(this.ledMesh);

        // Optical Additive Bloom Sprite/Halo for the Green LED
        const bloomCanvas = document.createElement('canvas');
        bloomCanvas.width = 128;
        bloomCanvas.height = 128;
        const bctx = bloomCanvas.getContext('2d');
        const bGrad = bctx.createRadialGradient(64, 64, 2, 64, 64, 60);
        bGrad.addColorStop(0.0, 'rgba(180, 255, 195, 0.95)');
        bGrad.addColorStop(0.22, 'rgba(45, 255, 90, 0.65)');
        bGrad.addColorStop(0.55, 'rgba(15, 210, 60, 0.20)');
        bGrad.addColorStop(1.0, 'rgba(0, 180, 40, 0.0)');
        bctx.fillStyle = bGrad;
        bctx.fillRect(0, 0, 128, 128);

        const bloomTex = new THREE.CanvasTexture(bloomCanvas);
        const bloomMat = new THREE.MeshBasicMaterial({
          map: bloomTex,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const bloomPlaneGeo = new THREE.PlaneGeometry(16.0, 10.5);
        this.ledBloomMesh = new THREE.Mesh(bloomPlaneGeo, bloomMat);
        this.ledBloomMesh.position.set(ledX, ledY, 0.75);
        this.group.add(this.ledBloomMesh);

        // 5. Emergency Eject Pinhole (Right of Center)
        const pinholeGeo = new THREE.CylinderGeometry(0.85, 0.85, 1.5, 16);
        pinholeGeo.rotateX(Math.PI / 2);
        const pinholeMesh = new THREE.Mesh(pinholeGeo, mats.get('deepRecessBlack'));
        pinholeMesh.position.set(34.5, -9.8, -0.1);
        this.group.add(pinholeMesh);

        // 6. Pill-Shaped Drive Eject Push-Button (Lower-Right of Bezel)
        const btnX = 48.0;
        const btnY = -12.0;
        const pillLength = 14.0;
        const pillRadius = 2.3;

        const createPillShape = (len, rad) => {
          const shape = new THREE.Shape();
          const halfL = len / 2;
          shape.moveTo(-halfL, -rad);
          shape.lineTo(halfL, -rad);
          shape.absarc(halfL, 0, rad, -Math.PI / 2, Math.PI / 2, false);
          shape.lineTo(-halfL, rad);
          shape.absarc(-halfL, 0, rad, Math.PI / 2, (3 * Math.PI) / 2, false);
          return shape;
        };

        const recessShape = createPillShape(pillLength + 0.8, pillRadius + 0.45);
        const recessGeo = new THREE.ExtrudeGeometry(recessShape, { depth: 1.2, bevelEnabled: false });
        const btnRecess = new THREE.Mesh(recessGeo, mats.get('deepRecessBlack'));
        btnRecess.position.set(btnX, btnY, -0.65);
        this.group.add(btnRecess);

        const btnShape = createPillShape(pillLength, pillRadius);
        const btnGeo = new THREE.ExtrudeGeometry(btnShape, {
          depth: 1.6,
          bevelEnabled: true,
          bevelThickness: 0.45,
          bevelSize: 0.35,
          bevelSegments: 3
        });
        this.ejectBtnMesh = new THREE.Mesh(btnGeo, mats.get('dvdBezelPlastic'));
        this.ejectBtnMesh.position.set(btnX, btnY, -0.6);
        this.ejectBtnMesh.castShadow = true;
        this.group.add(this.ejectBtnMesh);

        this.registerInteractable(this.ejectBtnMesh, {
          type: 'button',
          action: 'toggleTray',
          pressAxis: 'z',
          basePos: -0.6,
          pressDepth: -1.15
        });
      }

      update(delta) {
        const state = this.context.state;
        const targetZ = (state.powerOn && state.trayOpen) ? 105.0 : 0.0;
        this.trayGroup.position.z += (targetZ - this.trayGroup.position.z) * Math.min(1.0, delta * 7.5);

        if (state.powerOn && state.isPlaying && !state.trayOpen) {
          this.discMesh.rotation.y += delta * 12.0;
        }

        this.ledMesh.visible = state.powerOn;
        this.ledBloomMesh.visible = state.powerOn;
      }
    }

    /**
     * 5.4 16x2 DOT-MATRIX LCD DISPLAY COMPONENT (Upper-Left of Top Panel)
     * Reverted to the clean, crisp, rock-solid 16x2 backlit LCD design matching the reference photo
     */
    export class LcdDisplayComponent extends Component3D {
      init() {
        const { chassisHeight } = AppConfig.dimensions;
        const layout = AppConfig.topLayout.lcd;
        const mats = this.context.materials;

        const topY = chassisHeight / 2; // +43.5 mm
        this.group.position.set(layout.x, topY, layout.z);

        const frameW = layout.bezelW;
        const frameD = layout.bezelD;
        const winW = layout.winW;
        const winD = layout.winD;

        // Matte black bevelled outer bezel frame (`81.4mm x 25.2mm`)
        const outerShape = new THREE.Shape();
        outerShape.moveTo(-frameW / 2, -frameD / 2);
        outerShape.lineTo(frameW / 2, -frameD / 2);
        outerShape.lineTo(frameW / 2, frameD / 2);
        outerShape.lineTo(-frameW / 2, frameD / 2);
        outerShape.closePath();

        const holePath = new THREE.Path();
        holePath.moveTo(-winW / 2, -winD / 2);
        holePath.lineTo(winW / 2, -winD / 2);
        holePath.lineTo(winW / 2, winD / 2);
        holePath.lineTo(-winW / 2, winD / 2);
        holePath.closePath();
        outerShape.holes.push(holePath);

        const bezelGeo = new THREE.ExtrudeGeometry(outerShape, {
          depth: 2.2,
          bevelEnabled: true,
          bevelThickness: 0.55,
          bevelSize: 0.45,
          bevelSegments: 3
        });
        bezelGeo.rotateX(Math.PI / 2);
        const bezelMesh = new THREE.Mesh(bezelGeo, mats.get('matteBlackPlastic'));
        bezelMesh.position.set(0, 2.25, 0);
        bezelMesh.castShadow = true;
        bezelMesh.receiveShadow = true;
        this.group.add(bezelMesh);

        // Dark recessed interior well walls behind the LCD window
        const wellGeo = new THREE.BoxGeometry(winW + 1.2, 1.2, winD + 1.2);
        const wellMesh = new THREE.Mesh(wellGeo, mats.get('deepRecessBlack'));
        wellMesh.position.set(0, 0.3, 0);
        this.group.add(wellMesh);

        // Dynamic Canvas Texture for the 16x2 character LCD screen (clean, self-illuminated, zero external overlay planes)
        this.lcdCanvas = document.createElement('canvas');
        this.lcdCanvas.width = 1024;
        this.lcdCanvas.height = 256;
        this.lcdCtx = this.lcdCanvas.getContext('2d');

        this.lcdTexture = new THREE.CanvasTexture(this.lcdCanvas);
        this.lcdTexture.colorSpace = THREE.SRGBColorSpace;
        this.lcdTexture.minFilter = THREE.LinearFilter;
        this.lcdTexture.magFilter = THREE.LinearFilter;
        this.lcdTexture.anisotropy = 8;

        // Self-illuminated MeshBasicMaterial so the backlit amber/yellow screen is always 100% crisp and immune to shader/z-fighting artifacts
        this.lcdMaterial = new THREE.MeshBasicMaterial({
          map: this.lcdTexture
        });

        const screenGeo = new THREE.PlaneGeometry(winW + 0.4, winD + 0.4);
        screenGeo.rotateX(-Math.PI / 2);
        this.screenMesh = new THREE.Mesh(screenGeo, this.lcdMaterial);
        this.screenMesh.position.set(0, 0.95, 0);
        this.group.add(this.screenMesh);

        this.lastRenderedText = '';
        this.renderLcdScreen();
      }

      formatTime(totalSec) {
        const mins = Math.floor(totalSec / 60);
        const secs = Math.floor(totalSec % 60);
        const frames = Math.floor((totalSec - Math.floor(totalSec)) * 100);
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(mins)}:${pad(secs)}:${pad(frames)}`;
      }

      renderLcdScreen() {
        const state = this.context.state;
        const line1 = !state.powerOn
          ? '                '
          : state.trayOpen
            ? '     Open       '
            : `    Track ${state.track}     `;
        const line2 = !state.powerOn
          ? '                '
          : `   ${this.formatTime(state.elapsedSeconds)}     `;

        const key = `${state.powerOn}|${line1}|${line2}`;
        if (key === this.lastRenderedText) return;
        this.lastRenderedText = key;

        const ctx = this.lcdCtx;
        const w = this.lcdCanvas.width;
        const h = this.lcdCanvas.height;

        if (!state.powerOn) {
          ctx.fillStyle = '#1f1408';
          ctx.fillRect(0, 0, w, h);
          this.lcdTexture.needsUpdate = true;
          return;
        }

        // Authentic Amber/Orange Backlit Cavity Gradient matching the Top View reference photo:
        // Warm golden-amber luminous border framing a deeper amber-orange center
        ctx.fillStyle = '#f2ab22';
        ctx.fillRect(0, 0, w, h);

        const grad = ctx.createRadialGradient(w * 0.5, h * 0.5, h * 0.10, w * 0.5, h * 0.5, w * 0.50);
        grad.addColorStop(0.0, '#a8470c');
        grad.addColorStop(0.55, '#b8500e');
        grad.addColorStop(0.82, '#d87914');
        grad.addColorStop(0.96, '#f0a620');
        grad.addColorStop(1.0, '#f5b428');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Subtle inner bezel shadow along top & bottom edges of the recessed LCD window
        const topEdgeGrad = ctx.createLinearGradient(0, 0, 0, 22);
        topEdgeGrad.addColorStop(0.0, 'rgba(30, 10, 0, 0.45)');
        topEdgeGrad.addColorStop(1.0, 'rgba(30, 10, 0, 0.0)');
        ctx.fillStyle = topEdgeGrad;
        ctx.fillRect(0, 0, w, 22);

        // Draw 16x2 character cell matrix (5x7 dot-matrix per character)
        const cols = 16;
        const rows = 2;
        const marginX = 64;
        const marginY = 24;
        const availW = w - marginX * 2;
        const availH = h - marginY * 2;
        const cellW = availW / cols;
        const cellH = availH / rows;
        const dotStepX = (cellW * 0.80) / 5;
        const dotStepY = (cellH * 0.84) / 7;
        const dotSizeX = dotStepX * 0.78;
        const dotSizeY = dotStepY * 0.78;

        const lines = [line1.padEnd(16, ' ').slice(0, 16), line2.padEnd(16, ' ').slice(0, 16)];

        for (let r = 0; r < rows; r++) {
          const text = lines[r];
          for (let c = 0; c < cols; c++) {
            const glyph = ProceduralTextures.getLcdGlyph(text[c]);
            const cellOriginX = marginX + c * cellW + cellW * 0.10;
            const cellOriginY = marginY + r * cellH + cellH * 0.08;

            // Faint 5x7 unlit character matrix box (visible in reference photo)
            ctx.fillStyle = 'rgba(70, 24, 2, 0.12)';
            ctx.fillRect(cellOriginX - 2, cellOriginY - 2, dotStepX * 5 + 2, dotStepY * 7 + 2);

            for (let gy = 0; gy < 7; gy++) {
              const rowBits = glyph[gy];
              for (let gx = 0; gx < 5; gx++) {
                const isLit = (rowBits >> (4 - gx)) & 1;
                const px = cellOriginX + gx * dotStepX;
                const py = cellOriginY + gy * dotStepY;

                if (isLit) {
                  // Soft amber pixel halo + bright yellow-amber LED/VFD dot core
                  ctx.save();
                  ctx.shadowColor = '#ffae00';
                  ctx.shadowBlur = 6;
                  ctx.fillStyle = '#fff55a';
                  ctx.fillRect(px, py, dotSizeX, dotSizeY);
                  ctx.restore();

                  ctx.fillStyle = '#ffffa8';
                  ctx.fillRect(px + 0.5, py + 0.5, dotSizeX - 1.0, dotSizeY - 1.0);
                } else {
                  ctx.fillStyle = 'rgba(80, 28, 4, 0.24)';
                  ctx.fillRect(px, py, dotSizeX, dotSizeY);
                }
              }
            }
          }
        }

        this.lcdTexture.needsUpdate = true;
      }

      update(delta) {
        const state = this.context.state;
        if (state.powerOn && state.isPlaying && !state.trayOpen) {
          const pitchRate = 1.0 - state.pitchNormalized * 0.16;
          state.elapsedSeconds += delta * pitchRate;
        }
        this.renderLcdScreen();
      }
    }

    /**
     * ============================================================================
     * 6. INTERACTION CONTROLLER (Raycasting for Buttons, Rocker Switch & Pitch Fader)
     * ============================================================================
     */
    export class InteractionController {
      constructor(context) {
        this.context = context;
        this.raycaster = new THREE.Raycaster();
        this.pointer = new THREE.Vector2();
        this.dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -AppConfig.dimensions.chassisHeight / 2 - 6.0);
        this.intersectPoint = new THREE.Vector3();

        this.activeFader = null;
        this.activeButton = null;

        this.bindEvents();
      }

      bindEvents() {
        const dom = this.context.renderer.domElement;
        dom.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        window.addEventListener('pointermove', (e) => this.onPointerMove(e));
        window.addEventListener('pointerup', (e) => this.onPointerUp(e));
      }

      updatePointer(event) {
        const rect = this.context.renderer.domElement.getBoundingClientRect();
        this.pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        this.pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      onPointerDown(event) {
        this.updatePointer(event);
        this.raycaster.setFromCamera(this.pointer, this.context.camera);
        const hits = this.raycaster.intersectObjects(this.context.rootComponent.interactables, true);

        if (hits.length > 0) {
          let obj = hits[0].object;
          while (obj && !obj.userData.interactable) {
            obj = obj.parent;
          }
          if (!obj) return;

          const handler = obj.userData.handler;
          if (handler.type === 'fader') {
            this.activeFader = handler;
            this.context.controls.enabled = false;
            this.context.renderer.domElement.style.cursor = 'ns-resize';
          } else if (handler.type === 'button') {
            this.activeButton = { mesh: obj, handler };
            obj.position[handler.pressAxis] = handler.pressDepth;
            this.triggerAction(handler.action);
          } else if (handler.type === 'rocker') {
            this.triggerAction(handler.action);
          }
        }
      }

      onPointerMove(event) {
        this.updatePointer(event);
        this.raycaster.setFromCamera(this.pointer, this.context.camera);

        if (this.activeFader) {
          if (this.raycaster.ray.intersectPlane(this.dragPlane, this.intersectPoint)) {
            const localPoint = this.context.rootComponent.group.worldToLocal(this.intersectPoint.clone());
            const clampedZ = Math.max(this.activeFader.minZ, Math.min(this.activeFader.maxZ, localPoint.z));
            this.activeFader.faderGroup.position.z = clampedZ;
            this.context.state.pitchNormalized = (clampedZ - this.activeFader.centerZ) / this.activeFader.halfTravel;
          }
          return;
        }

        const hits = this.raycaster.intersectObjects(this.context.rootComponent.interactables, true);
        this.context.renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : '';
      }

      onPointerUp() {
        if (this.activeFader) {
          this.activeFader = null;
          this.context.controls.enabled = true;
          this.context.renderer.domElement.style.cursor = '';
        }
        if (this.activeButton) {
          const { mesh, handler } = this.activeButton;
          mesh.position[handler.pressAxis] = handler.basePos;
          this.activeButton = null;
        }
      }

      triggerAction(action) {
        const state = this.context.state;
        switch (action) {
          case 'togglePower':
            state.powerOn = !state.powerOn;
            if (!state.powerOn) state.trayOpen = false;
            break;
          case 'toggleTray':
            if (state.powerOn) {
              state.trayOpen = !state.trayOpen;
            }
            break;
          case 'playPause':
            if (state.powerOn && !state.trayOpen) {
              state.isPlaying = !state.isPlaying;
            }
            break;
          case 'prevTrack':
            if (state.powerOn && !state.trayOpen) {
              state.track = state.track > 1 ? state.track - 1 : 12;
              state.elapsedSeconds = 0.0;
            }
            break;
          case 'nextTrack':
            if (state.powerOn && !state.trayOpen) {
              state.track = state.track < 12 ? state.track + 1 : 1;
              state.elapsedSeconds = 0.0;
            }
            break;
          case 'rewind':
            if (state.powerOn && !state.trayOpen) {
              state.elapsedSeconds = Math.max(0.0, state.elapsedSeconds - 5.0);
            }
            break;
          case 'fastForward':
            if (state.powerOn && !state.trayOpen) {
              state.elapsedSeconds += 5.0;
            }
            break;
        }
      }
    }

    /**
     * ============================================================================
     * 7. DEVICE ASSEMBLER & SCENE MANAGER (WebGPU Renderer + HDRI Lighting)
     * ============================================================================
     */
    export class DeviceAssembler extends Component3D {
      init() {
        this.addSubComponent(new ChassisComponent('chassis', this.context));
        this.addSubComponent(new WoodCheeksComponent('woodCheeks', this.context));
        this.addSubComponent(new DvdDriveComponent('dvdDrive', this.context));
        this.addSubComponent(new LcdDisplayComponent('lcdDisplay', this.context));
        this.addSubComponent(new TopPanelControlsComponent('topControls', this.context));
        this.addSubComponent(new RearPanelComponent('rearPanel', this.context));
      }
    }

    export class DeviceApp {
      constructor(container) {
        this.container = container;
        this.state = { ...AppConfig.initialState };
        this.clock = new THREE.Clock();
        this.customModules = new Map();
      }

      async init() {
        // Verify WebGPU device availability upfront so restricted iframes fall back cleanly
        let forceWebGL = false;
        if (navigator.gpu) {
          try {
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
              forceWebGL = true;
            } else {
              const testDevice = await adapter.requestDevice();
              testDevice.destroy();
            }
          } catch (e) {
            forceWebGL = true;
          }
        } else {
          forceWebGL = true;
        }

        this.renderer = new THREE.WebGPURenderer({
          antialias: true,
          alpha: false,
          forceWebGL,
          powerPreference: 'high-performance'
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.08;
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        await this.renderer.init();
        this.container.appendChild(this.renderer.domElement);

        // Scene with Photographic Studio Background & High-Contrast Studio HDRI
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(AppConfig.colors.studioBg);

        // 1. Apply high-contrast 32-bit Radiance (.hdr RGBE) Studio HDRI immediately
        const studioHdri = ProceduralTextures.createStudioRadianceHDRI(1024, 512);
        this.scene.environment = studioHdri;
        this.scene.environmentIntensity = 1.15;

        // 2. Load real photographic studio HDRI with high contrast & natural depth
        this.loadExternalHDRI('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr');

        // Perspective Camera
        this.camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 5.0, 2500.0);
        this.camera.position.set(175, 165, 290);

        // OrbitControls
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.055;
        this.controls.target.set(0, -2, 0);
        this.controls.minDistance = 120;
        this.controls.maxDistance = 750;
        this.controls.maxPolarAngle = Math.PI * 0.56;
        this.controls.update();

        // Setup High-Contrast Studio Softbox & Contact Shadow Rig
        this.setupHdriStudioRig();

        // Initialize Material Library & Root Device Assembly
        this.materials = new MaterialLibrary();
        this.rootComponent = new DeviceAssembler('djCdDevice', this);
        this.rootComponent.init();
        this.scene.add(this.rootComponent.group);

        // Initialize Interactive Raycaster Controller
        this.interaction = new InteractionController(this);

        // Responsive Viewport Resize Handler
        window.addEventListener('resize', () => this.onResize());

        // Start Render Loop
        this.renderer.setAnimationLoop(() => this.render());
      }

      /**
       * Loads a real photographic studio .hdr file via RGBELoader and PMREMGenerator
       * (with automatic fallback to EquirectangularReflectionMapping)
       */
      loadExternalHDRI(url) {
        const loader = new RGBELoader();
        loader.load(
          url,
          (hdrTexture) => {
            hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
            hdrTexture.minFilter = THREE.LinearFilter;
            hdrTexture.magFilter = THREE.LinearFilter;
            hdrTexture.needsUpdate = true;

            try {
              if (THREE.PMREMGenerator) {
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                pmremGenerator.compileEquirectangularShader();
                const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;
                this.scene.environment = envMap;
                hdrTexture.dispose();
                pmremGenerator.dispose();
                return;
              }
            } catch (e) {
              // Fallback to direct equirectangular HDR texture on WebGPU backend
            }
            this.scene.environment = hdrTexture;
          },
          undefined,
          () => {}
        );
      }

      setupHdriStudioRig() {
        // 1. Primary Key Softbox Light (Front-Right Overhead) for strong 3D form, deep shadows & crisp orange-peel highlights
        const keyLight = new THREE.DirectionalLight(0xfffaf2, 2.85);
        keyLight.position.set(115, 225, 195);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 50;
        keyLight.shadow.camera.far = 650;
        const d = 135;
        keyLight.shadow.camera.left = -d;
        keyLight.shadow.camera.right = d;
        keyLight.shadow.camera.top = d;
        keyLight.shadow.camera.bottom = -d;
        keyLight.shadow.bias = -0.0004;
        this.scene.add(keyLight);

        // 2. Dramatic Rear-Left Rim / Backlight to carve out top controls, fader knob & chassis edges
        const rimLight = new THREE.DirectionalLight(0xfff5e8, 2.15);
        rimLight.position.set(-140, 145, -195);
        this.scene.add(rimLight);

        // 3. Rear-Right Low Specular Softbox (reproduces the lower-right orange-peel reflection in the Rear View photo)
        const rearSoftbox = new THREE.DirectionalLight(0xfffcf8, 1.65);
        rearSoftbox.position.set(-85, -35, -220);
        this.scene.add(rearSoftbox);

        // 4. Subtle Lateral Grazing Kicker for the oak wood pore relief and DVD bezel depth
        const sideKicker = new THREE.DirectionalLight(0xffeedd, 0.95);
        sideKicker.position.set(240, 55, 65);
        this.scene.add(sideKicker);

        // Soft studio floor contact shadow plane directly beneath the 4 rubber feet
        const floorY = -AppConfig.dimensions.chassisHeight / 2 - AppConfig.dimensions.footHeight + 0.3;

        const aoCanvas = document.createElement('canvas');
        aoCanvas.width = 1024;
        aoCanvas.height = 1024;
        const actx = aoCanvas.getContext('2d');
        actx.clearRect(0, 0, 1024, 1024);

        actx.save();
        actx.translate(512, 518);
        actx.scale(1.0, 1.06);
        const bodyGrad = actx.createRadialGradient(0, 0, 65, 0, 0, 395);
        bodyGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0.52)');
        bodyGrad.addColorStop(0.48, 'rgba(0, 0, 0, 0.34)');
        bodyGrad.addColorStop(0.76, 'rgba(0, 0, 0, 0.11)');
        bodyGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
        actx.fillStyle = bodyGrad;
        actx.fillRect(-512, -512, 1024, 1024);
        actx.restore();

        const planeW = 280;
        const planeD = 300;
        const { footInsetX, footInsetZ } = AppConfig.dimensions;
        const feetCoords = [
          [-footInsetX, -footInsetZ],
          [footInsetX, -footInsetZ],
          [-footInsetX, footInsetZ],
          [footInsetX, footInsetZ]
        ];
        for (const [fx, fz] of feetCoords) {
          const cx = 512 + (fx / planeW) * 1024;
          const cy = 512 + (fz / planeD) * 1024;
          const footGrad = actx.createRadialGradient(cx, cy, 6, cx, cy, 58);
          footGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0.64)');
          footGrad.addColorStop(0.50, 'rgba(0, 0, 0, 0.24)');
          footGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
          actx.fillStyle = footGrad;
          actx.beginPath();
          actx.arc(cx, cy, 58, 0, Math.PI * 2);
          actx.fill();
        }

        const aoTex = new THREE.CanvasTexture(aoCanvas);
        const aoGeo = new THREE.PlaneGeometry(planeW, planeD);
        aoGeo.rotateX(-Math.PI / 2);
        const aoMat = new THREE.MeshBasicMaterial({
          map: aoTex,
          transparent: true,
          depthWrite: false
        });
        const aoMesh = new THREE.Mesh(aoGeo, aoMat);
        aoMesh.position.y = floorY + 0.05;
        this.scene.add(aoMesh);
      }

      registerComponent(componentInstance) {
        this.rootComponent.addSubComponent(componentInstance);
        return componentInstance;
      }

      registerWebModule(name, moduleInstance) {
        this.customModules.set(name, moduleInstance);
        if (typeof moduleInstance.init === 'function') {
          moduleInstance.init(this);
        }
        return moduleInstance;
      }

      onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      render() {
        const delta = Math.min(this.clock.getDelta(), 0.1);
        const elapsed = this.clock.getElapsedTime();

        this.controls.update();
        this.rootComponent.update(delta, elapsed);

        for (const mod of this.customModules.values()) {
          if (typeof mod.update === 'function') {
            mod.update(delta, elapsed);
          }
        }

        this.renderer.render(this.scene, this.camera);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('viewport');
      const app = new DeviceApp(container);
      window.DeviceApp = app;
      await app.init();
    });
  </script>
</body>
